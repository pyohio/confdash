[project]
name = "confdash"
version = "0.1.0"
description = "Conference management for community events: video review, captions, and organizer dashboards"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "django-environ>=0.12",
    "django-ninja>=1.4",
    "django-typer>=3.2",
    "rich>=14.0",
    "django-unfold>=0.68",
    "cryptography>=46.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "structlog>=25.4",
    "whitenoise>=6.9",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=23.0",
    "sentry-sdk>=2.30",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-cov>=6.2",
    "ruff>=0.13",
    "commitizen>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project", "src/accounts", "src/common", "src/events", "src/integrations"]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DTZ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test; test data is not a security boundary.
"**/tests/**" = ["S101", "S105", "S106"]
"**/test_*.py" = ["S101", "S105", "S106"]
# Settings legitimately reads secrets and branches on DEBUG.
"src/project/settings.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "common",
    "events",
    "integrations",
    "project",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["test_*.py", "tests.py"]
filterwarnings = ["error"]
addopts = "--strict-markers"
markers = [
    "unit: no database or network, fast",
    "integration: needs the database or other services",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["src/project/version.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
# Keep the lockfile in step with the version bump commit.
post_bump_hooks = ["uv lock", "git add uv.lock"]
