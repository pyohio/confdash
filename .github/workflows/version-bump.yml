name: Version Bump

# Manual on purpose. Merging to main does not release; a human decides when a version happens.
# Pushing the tag triggers Release.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Bump type (leave blank to auto-detect from conventional commits)"
        required: false
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Bump version and update changelog
        id: bump
        env:
          # Via env rather than inline interpolation, so the value is never part of the script.
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail
          if [ -n "$BUMP_TYPE" ]; then
            uv run cz bump --increment "$BUMP_TYPE" --yes
          else
            uv run cz bump --yes
          fi
          echo "version=$(uv run cz version --project)" >> "$GITHUB_OUTPUT"

      - name: Push the commit and tag
        run: git push --follow-tags origin main

      - name: Summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: echo "Bumped to $VERSION. The Release workflow builds and publishes the tag." >> "$GITHUB_STEP_SUMMARY"
