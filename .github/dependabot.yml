version: 2
updates:
  # Grouped weekly so review is one PR per ecosystem rather than a stream of individual bumps.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies"]
