# Local development stack. Production uses the multi-stage Dockerfile; this uses Dockerfile.dev
# for hot reload with the source bind-mounted.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-confdash}
      POSTGRES_USER: ${POSTGRES_USER:-confdash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confdash}
    ports:
      # Published only so host tools (a GUI client, psql) can connect. The app reaches postgres by
      # service name and never uses this. Override when another project already holds the port.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql, not at .../data: the data
      # directory becomes a subdirectory so `pg_upgrade --link` can work across major versions
      # without crossing a mount boundary.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-confdash} -d ${POSTGRES_DB:-confdash}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # start_interval probes every second until the first success, so `app`, gated on
      # service_healthy, starts as soon as postgres is actually ready instead of waiting for the
      # next interval tick. Steady-state interval is unchanged. Needs Docker Engine 25+.
      start_period: 10s
      start_interval: 1s

  # Catches all outbound mail locally so speaker magic links can be clicked in development
  # without sending anything.
  mailpit:
    # Pinned so a mailpit release cannot change dev-stack behavior without a deliberate bump.
    image: axllent/mailpit:v1.20
    ports:
      # Only the web UI is published, since reading mail is the one thing that happens from the
      # host. Non-default port so this stack can coexist with another project's mailpit.
      - "${MAILPIT_UI_PORT:-8026}:8025"
    expose:
      # SMTP stays inside the network: `app` is the only sender, and it resolves mailpit by name.
      - "1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python src/manage.py runserver 0.0.0.0:8000
    environment:
      # Set here rather than read from .env: `environment` wins over `env_file`, so a stray value
      # in a developer's .env cannot point the stack at another database or redirect its mail.
      DATABASE_URL: postgres://${POSTGRES_USER:-confdash}:${POSTGRES_PASSWORD:-confdash}@postgres:5432/${POSTGRES_DB:-confdash}
      DEBUG: ${DEBUG:-True}
      EMAIL_URL: smtp://mailpit:1025
      # Applied on container start so a fresh checkout comes up with a usable schema.
      RUN_MIGRATIONS: "true"
      # Reconcile the venv volume with uv.lock on start, so a dependency change does not leave the
      # container running against a stale environment.
      SYNC_DEPENDENCIES: "true"
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Bind-mount the source for hot reload. The named volume keeps the image's virtualenv
      # from being shadowed by anything on the host.
      - .:/app
      - venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # Same probe the production Dockerfile uses, so a break shows up in development first.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Generous, because the entrypoint reconciles the venv against uv.lock and runs migrations
      # before serving. Costs nothing: failures during start_period do not count toward retries,
      # and start_interval marks the container healthy as soon as a probe passes.
      start_period: 90s
      start_interval: 2s

volumes:
  postgres_data:
  venv:
